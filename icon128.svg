<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(99,102,241,0.45)"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Shine overlay -->
  <rect x="8" y="8" width="112" height="56" rx="24" ry="24" fill="url(#shine)"/>

  <!-- Graduation cap — base square -->
  <rect x="38" y="62" width="52" height="28" rx="5" fill="rgba(255,255,255,0.22)"/>

  <!-- Graduation cap — top diamond/mortarboard -->
  <polygon points="64,28 100,48 64,58 28,48" fill="white"/>

  <!-- Mortarboard shine -->
  <polygon points="64,28 100,48 64,38" fill="rgba(255,255,255,0.3)"/>

  <!-- Cap center button -->
  <circle cx="64" cy="28" r="5" fill="white"/>

  <!-- Tassel string -->
  <line x1="100" y1="48" x2="100" y2="72" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Tassel end -->
  <circle cx="100" cy="75" r="4" fill="white"/>
  <line x1="97" y1="78" x2="94" y2="88" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="79" x2="100" y2="90" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="103" y1="78" x2="106" y2="88" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
